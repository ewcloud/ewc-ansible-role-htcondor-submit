---
- name: Verify Linux distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Rocky' and ansible_facts['distribution_major_version'] in ['8', '9']
    fail_msg: "Supports RockyLinux 8 or 9. Detected: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}."
    success_msg: "Running supported {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }} distribution."

- name: Validate user inputs
  ansible.builtin.assert:
    that:
      - headscale_preauthkey is string and headscale_preauthkey is defined and headscale_preauthkey != ''
      - headscale_login_server is string and headscale_login_server is defined and headscale_login_server != ''
      - htcondor_cm_external_ip is string and htcondor_cm_external_ip is defined and htcondor_cm_external_ip != ''
      - htcondor_password is string and htcondor_password is defined and htcondor_password != ''
      - htcondor_reinstall is string and htcondor_reinstall is defined and htcondor_reinstall != ''
      - tenancy_name is defined and tenancy_name is string and tenancy_name is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
    fail_msg: "Input validation failed. See README.md for information on required inputs and their format."
    success_msg: "User input configuration is valid."

- name: Forge new target host FQDN
  ansible.builtin.set_fact:
    target_short_name: "{{ ansible_facts['hostname'] }}"
    target_fqdn: "{{ ansible_facts['hostname'] }}.{{ tenancy_name }}.ewc"

- name: Validating new target host FQDN
  ansible.builtin.assert:
    that:
      - target_fqdn | length <= 64  # static hostname limit
    fail_msg: "Target hostname and fully qualified domain domain name validation failed."
    success_msg: "Target hostname and fully qualified domain name configuration is valid."

- name: Remove legacy .novalocal FQDN suffix from /etc/hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '[ \t]+{{ target_short_name | regex_escape }}\.novalocal(?=[ \t]|$)'
    replace: ''

- name: Ensure /etc/hosts maps the FQDN
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ target_fqdn }} {{ target_short_name }}"

- name: Set static hostname to the FQDN
  ansible.builtin.hostname:
    name: "{{ target_fqdn }}"
    use: systemd

- name: Stop cloud-init from resetting hostname / hosts
  ansible.builtin.copy:
    content: |
      # Managed by Ansible
      preserve_hostname: true
      manage_etc_hosts: false
    dest: /etc/cloud/cloud.cfg.d/99_preserve_hostname.cfg
    owner: root
    group: root
    mode: "0644"

- name: Verify hostname and FQDN reconciliation
  ansible.builtin.command: "{{ item }}"
  loop:
    - "hostnamectl --static"
    - "hostname -f"
  register: hostname_results
  changed_when: false
  failed_when: hostname_results.stdout != target_fqdn

- name: Warn if user-data overrides the drop-in
  ansible.builtin.command: grep -qs "manage_etc_hosts' as True" /etc/hosts
  register: cloudinit_hosts
  changed_when: false
  failed_when: cloudinit_hosts.rc == 0

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Ensure dnf-plugins-core is enabled
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Add the Tailscale yum repository definition
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/tailscale.repo"
    dest: /etc/yum.repos.d/tailscale.repo
    mode: "0644"
    owner: root
    group: root
  when: "'tailscale' not in ansible_facts.packages"

- name: Install the Tailscale package
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
    allow_downgrade: false
  loop:
    - tailscale

- name: Ensure the tailscaled service is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Determine whether enrollment is required
  ansible.builtin.set_fact:
    tailscale_needs_enrollment: >-
      {{
        tailscale_status.rc != 0 or
        (tailscale_status.stdout | from_json).BackendState != 'Running'
      }}

- name: Write the Headscale pre-auth key to a transient, root-only file
  ansible.builtin.copy:
    content: "{{ headscale_preauthkey }}"
    dest: "{{ tailscale_authkey_file }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  when: tailscale_needs_enrollment

- name: Enroll node into the Headscale VPN server
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --login-server {{ headscale_login_server }}
      --authkey file:{{ tailscale_authkey_file }}
  no_log: true
  changed_when: true
  when: tailscale_needs_enrollment

- name: Remove the transient pre-auth key file
  ansible.builtin.file:
    path: "{{ tailscale_authkey_file }}"
    state: absent

- name: Force uninstall condor package while keeping its dependencies
  ansible.builtin.dnf:
    name: condor
    state: absent
    autoremove: false
  when: htcondor_reinstall == "yes"

- name: Delete left-over condor config files
  ansible.builtin.file:
    path: /etc/condor
    state: absent
  when: htcondor_reinstall == "yes"

- name: Download the HTCondor bootstrap installer
  ansible.builtin.get_url:
    url: https://get.htcondor.org
    dest: /tmp/get_htcondor.sh
    mode: "0755"
    owner: root
    group: root
  when:
    - "'condor' not in ansible_facts.packages or htcondor_reinstall == 'yes'"

- name: Install HTCondor as a submit node
  ansible.builtin.command:
    cmd: /tmp/get_htcondor.sh --no-dry-run --channel stable --submit "{{ htcondor_cm_external_ip }}" --password "{{ htcondor_password }}"
  no_log: true
  changed_when: true
  when:
    - "'condor' not in ansible_facts.packages or htcondor_reinstall == 'yes'"

- name: Remove the temporary installer script
  ansible.builtin.file:
    path: /tmp/get_htcondor.sh
    state: absent

- name: Ensure the condor service is enabled and started
  ansible.builtin.systemd:
    name: condor
    enabled: true
    state: started

- name: Deploy HTCondor submit-node configuration
  ansible.builtin.template:
    src: 01-submit.config.j2
    dest: "{{ htcondor_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart HTCondor

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: List installed package versions
  ansible.builtin.debug:
    msg:
      - "tailscale: {{ ansible_facts.packages['tailscale'][0].version }}-{{ ansible_facts.packages['tailscale'][0].release }}"
      - "htcondor: {{ ansible_facts.packages['htcondor-release'][0].version }}-{{ ansible_facts.packages['htcondor-release'][0].release }}"

- name: Temporary setup Trivy for SBOM auto-generation (standalone binary file at /tmp/trivy)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp
    creates: /tmp/trivy
  args:
    executable: /bin/bash

- name: Auto-generate SBOM (SPDX file at /sbom.json)
  ansible.builtin.command:
    cmd: ./trivy rootfs --pkg-types os --format spdx-json --output /sbom.json --scanners vuln /
    chdir: /tmp
  changed_when: true
