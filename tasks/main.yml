---
- name: Verify Linux distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] in ['22', '24']
    fail_msg: "Supports Ubuntu 22 and 24. Detected: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}."
    success_msg: "Running supported {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }} distribution."

- name: Check whether the Tailscale package is already present
  ansible.builtin.command: tailscale version
  register: tailscale_version
  changed_when: false
  failed_when: false

- name: Add Tailscale's apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
    owner: root
    group: root
  when: tailscale_version.rc != 0

- name: Add the Tailscale apt repository definition
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.tailscale.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    owner: root
    group: root
  register: tailscale_repo
  when: tailscale_version.rc != 0

- name: Refresh apt cache after adding the Tailscale repository
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo is changed # noqa: no-handler

- name: Install the Tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Ensure the tailscaled service is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Determine whether enrollment is required
  ansible.builtin.set_fact:
    tailscale_needs_enrollment: >-
      {{
        tailscale_status.rc != 0 or
        (tailscale_status.stdout | from_json).BackendState != 'Running'
      }}

- name: Write the Headscale pre-auth key to a transient, root-only file
  ansible.builtin.copy:
    content: "{{ headscale_preauthkey }}"
    dest: "{{ tailscale_authkey_file }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  when: tailscale_needs_enrollment

- name: Enroll node into the Headscale VPN server
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --login-server {{ headscale_login_server }}
      --authkey file:{{ tailscale_authkey_file }}
  no_log: true
  changed_when: true
  when: tailscale_needs_enrollment

- name: Remove the transient pre-auth key file
  ansible.builtin.file:
    path: "{{ tailscale_authkey_file }}"
    state: absent

- name: Check whether HTCondor is already installed
  ansible.builtin.command: condor_version
  register: condor_version
  changed_when: false
  failed_when: false

- name: Download the HTCondor bootstrap installer
  ansible.builtin.get_url:
    url: https://get.htcondor.org
    dest: /tmp/get_htcondor.sh
    mode: "0755"
    owner: root
    group: root
  when: condor_version.rc != 0

- name: Install HTCondor as a submit node
  ansible.builtin.command:
    cmd: >-
      /tmp/get_htcondor.sh --no-dry-run --submit "{{ htcondor_cm_external_ip }}"
      --password "{{ htcondor_password }}"
  no_log: true
  changed_when: true
  when: condor_version.rc != 0

- name: Remove the temporary installer script
  ansible.builtin.file:
    path: /tmp/get_htcondor.sh
    state: absent

- name: Ensure the condor service is enabled and started
  ansible.builtin.systemd:
    name: condor
    enabled: true
    state: started
